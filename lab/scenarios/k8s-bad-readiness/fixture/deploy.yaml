apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: prod
spec:
  replicas: 3
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
      - name: app
        image: registry.internal/api:1.4.2
        resources:
          requests: {cpu: 50m}
          limits: {cpu: 500m, memory: 256Mi}

