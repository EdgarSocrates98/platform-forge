apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: shop, namespace: argocd}
spec:
  project: default
  source: {repoURL: https://git.internal/shop.git, path: k8s}
  destination: {server: https://kubernetes.default.svc, namespace: prod}
  syncPolicy:
    automated: {}   # sync but no selfHeal, no prune
