apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
      - name: app
        image: registry.internal/backend:1.4.2
        readinessProbe:
          tcpSocket: {port: 9000}
        livenessProbe:
          tcpSocket: {port: 9000}
        resources:
          limits: {cpu: 1, memory: 512Mi}

