    immediate: {changes: {resources: [{id: "aws_vpc.main", applied: true}]}}
  slo: {error_rate_max: 0.01}
  metrics: {error_rate: 0.7}
expect:
  ok: true
  convergence: regressed
  rollback_status: requires-replan
  rollback_refusal: PF-OPS-ROLLBACK-NOT-EXECUTABLE
