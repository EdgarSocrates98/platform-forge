apiVersion: apps/v1
kind: Deployment
metadata:
  name: solo
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels: {app: solo}
  template:
    metadata:
      labels: {app: solo}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
      - name: app
        image: registry.internal/solo:1.4.2
        readinessProbe:
          httpGet: {path: /, port: 80}
        livenessProbe:
          httpGet: {path: /, port: 80}
        resources:
          limits: {cpu: 200m, memory: 128Mi}

