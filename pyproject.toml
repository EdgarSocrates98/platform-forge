[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "platformforge"
version = "0.3.1"
description = "Agentic Platform Engineering intelligence platform — deterministic, offline-first, evidence-first"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Edgar Socrates Caria" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "python-hcl2>=4.3,<8",
]

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
mcp = ["mcp>=2.2,<3"]
dev = [
    "pytest>=9,<10",
    "ruff>=0.7,<1",
    # Sem isto `.[dev]` nao traz `python -m build` e o teste de
    # artefato real (test_artifact_contents) pularia o gate da wheel.
    "build>=1.0",
]

[project.scripts]
platformforge = "platformforge.cli.main:main"
platformforge-mcp = "platformforge.mcp.server:main"

[project.urls]
Homepage = "https://github.com/EdgarSocrates98/platform-forge"
Repository = "https://github.com/EdgarSocrates98/platform-forge"
Documentation = "https://github.com/EdgarSocrates98/platform-forge/blob/main/docs/README.md"
Changelog = "https://github.com/EdgarSocrates98/platform-forge/blob/main/CHANGELOG.md"
Issues = "https://github.com/EdgarSocrates98/platform-forge/issues"

[tool.hatch.build.targets.wheel]
packages = ["platformforge"]

# Ship runtime data inside the wheel under platformforge/data/ so an
# installed package is self-contained (platformforge/resources.py resolves it).
[tool.hatch.build.targets.wheel.force-include]
"rules" = "platformforge/data/rules"
"knowledge" = "platformforge/data/knowledge"
"contracts" = "platformforge/data/contracts"
"evals" = "platformforge/data/evals"
"lab" = "platformforge/data/lab"
"portal/assets" = "platformforge/portal_assets"
# Forge manifests (install-2.0 §8.2): install/service._context_manifest le
# `forge.json`/`forge.agentic.json` da raiz do checkout para compor o
# manifesto forge/context/v1 (integrity digests, host_adapters). Sob o wheel
# a raiz nao existe — os manifestos vao para `data`, a mesma convencao dos
# demais dados de runtime resolvidos por platformforge/resources.py.
"forge.json" = "platformforge/data/forge.json"
"forge.agentic.json" = "platformforge/data/forge.agentic.json"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: builds packages / clean-venv installs (wheel isolation gate — install-2.0 §8.4)",
]

[tool.ruff]
line-length = 110
target-version = "py310"
# eval fixtures are data (deliberately malformed/secret-bearing), not code
exclude = ["evals/cases/*/fixture/**", "lab/scenarios/*/fixture/**",
           # Vendored byte-parity files are formatted in the canonical repo.
           "platformforge/_forgecontext.py", "platformforge/_installkit.py"]

[tool.ruff.lint.per-file-ignores]
# Vendored Graph Studio kit (canonical: the-forge/src/theforge)
"platformforge/_graphview.py" = ["ALL"]
"platformforge/_graphstudio.py" = ["ALL"]
# Vendored Forge UI kit (canonical: the-forge/src/theforge/ui)
"platformforge/ui/**/*.py" = ["ALL"]
# Vendored shared engine (canonical: the-forge/scripts/installkit) — kept
# byte-identical to the shared source; linted in the canonical repo.
"platformforge/_installkit.py" = ["ALL"]
"platformforge/_forgecontext.py" = ["ALL"]
# Vendored Forge Portal server (canonical: forge-portal/portal_core) — kept
# byte-identical to the shared source; linted in the canonical repo.
"platformforge/_forge_portal.py" = ["ALL"]
"platformforge/_portal_telemetry.py" = ["ALL"]
"scripts/forge_bootstrap.py" = ["ALL"]
"scripts/forge_installkit.py" = ["ALL"]
