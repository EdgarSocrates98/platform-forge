# Kubernetes rules — the analyzer computes cross-resource coverage attrs
# (pdb_count, netpol_count) so rules stay per-fact. Convention: PF-K8S-NNN.
rules:
  - rule_id: PF-K8S-001
    domain: k8s
    title: "Image pinned to :latest or untagged"
    severity: medium
    applies_to: {fact_kind: k8s.workload}
    conditions:
      all:
        - {path: attrs.pod_spec.latest_tag, op: equals, value: true}
    message: "mutable tags break reproducibility and rollback"
    sources: ["k8s.io/docs/concepts/containers/images#image-names"]

  - rule_id: PF-K8S-002
    domain: k8s
    title: "Container without resource limits"
    severity: high
    applies_to: {fact_kind: k8s.workload}
    conditions:
      all:
        - {path: attrs.pod_spec.no_limits, op: gt, value: 0}
    message: "unbounded containers enable noisy-neighbor OOM/CPU starvation"
    sources: ["k8s.io/docs/concepts/configuration/manage-resources-containers"]

  - rule_id: PF-K8S-003
    domain: k8s
    title: "Container without health probes"
    severity: medium
    applies_to: {fact_kind: k8s.workload}
    conditions:
      all:
        - {path: attrs.pod_spec.no_probes, op: gt, value: 0}
    message: "unprobed containers hide dead-but-running failures"
    sources: ["k8s.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes"]

  - rule_id: PF-K8S-004
    domain: k8s
    title: "Privileged container"
    severity: critical
    applies_to: {fact_kind: k8s.workload}
    conditions:
      all:
        - {path: attrs.pod_spec.privileged, op: equals, value: true}
    message: "privileged containers have near-node-root capability"
    sources: ["k8s.io/docs/concepts/security/pod-security-standards#restricted"]

  - rule_id: PF-K8S-005
    domain: k8s
    title: "Workload may run as root"
    severity: high
    applies_to: {fact_kind: k8s.workload}
    conditions:
      all:
        - {path: attrs.pod_spec.run_as_non_root_set, op: equals,
           value: false}
        - {path: attrs.pod_spec.run_as_root, op: equals, value: false}
        - {path: attrs.kind, op: in, value: [Deployment, StatefulSet, DaemonSet]}
    message: "no runAsNonRoot set — root execution not prevented"
    sources: ["k8s.io/docs/concepts/security/pod-security-standards#restricted"]

  - rule_id: PF-K8S-006
    domain: k8s
    title: "Host network/PID/IPC namespace shared"
    severity: high
    applies_to: {fact_kind: k8s.workload}
    conditions:
      any:
        - {path: attrs.pod_spec.host_network, op: equals, value: true}
        - {path: attrs.pod_spec.host_pid, op: equals, value: true}
        - {path: attrs.pod_spec.host_ipc, op: equals, value: true}
    message: "host namespaces break pod isolation"
    sources: ["k8s.io/docs/concepts/security/pod-security-standards#baseline"]

  - rule_id: PF-K8S-007
    domain: k8s
    title: "Service-account token auto-mounted"
    severity: medium
    applies_to: {fact_kind: k8s.workload}
    conditions:
      all:
        - {path: attrs.pod_spec.automount_token, op: equals, value: true}
    message: "automounted tokens expand credential theft blast radius"
    sources: ["k8s.io/docs/tasks/configure-pod-container/configure-service-account"]

  - rule_id: PF-K8S-008
    domain: k8s
    title: "Deployment without PodDisruptionBudget"
    severity: medium
    applies_to: {fact_kind: k8s.workload}
    conditions:
      all:
        - {path: attrs.kind, op: in, value: [Deployment, StatefulSet]}
        - {path: attrs.pdb_count, op: equals, value: 0}
        - {path: attrs.replicas, op: gt, value: 0}
    message: "voluntary disruptions can take the workload to zero"
    sources: ["k8s.io/docs/tasks/run-application/configure-pdb"]

  - rule_id: PF-K8S-009
    domain: k8s
    title: "Secret-looking value hardcoded in env"
    severity: critical
    applies_to: {fact_kind: k8s.workload}
    conditions:
      all:
        - {path: attrs.pod_spec.env_hardcoded_secret, op: not_empty}
    message: "env values are plaintext in etcd, manifests and logs"
    sources: ["k8s.io/docs/concepts/configuration/secret#using-secrets-as-environment-variables"]

  - rule_id: PF-K8S-010
    domain: k8s
    title: "Ingress without TLS"
    severity: high
    applies_to: {fact_kind: k8s.ingress}
    conditions:
      all:
        - {path: attrs.tls, op: equals, value: false}
    message: "plaintext ingress terminates credentials in cleartext"
    sources: ["k8s.io/docs/concepts/services-networking/ingress#tls"]

  - rule_id: PF-K8S-011
    domain: k8s
    title: "Single-replica workload"
    severity: low
    applies_to: {fact_kind: k8s.workload}
    conditions:
      all:
        - {path: attrs.kind, op: equals, value: Deployment}
        - {path: attrs.replicas, op: lte, value: 1}
    message: "one replica = no availability through node failure"
    sources: ["k8s.io/docs/concepts/workloads/controllers/deployment#pod-template"]

  - rule_id: PF-K8S-012
    domain: k8s
    title: "Workload without NetworkPolicy"
    severity: medium
    applies_to: {fact_kind: k8s.workload}
    conditions:
      all:
        - {path: attrs.netpol_count, op: equals, value: 0}
    message: "no pod-level network segmentation declared"
    sources: ["k8s.io/docs/concepts/services-networking/network-policies"]

  - rule_id: PF-K8S-013
    domain: k8s
    title: "Secret keys present in manifest"
    severity: info
    applies_to: {fact_kind: k8s.secret}
    conditions:
      all:
        - {path: attrs.keys, op: not_empty}
    message: "manifest-held secrets should move to ESO/Vault"
    sources: ["k8s.io/docs/concepts/configuration/secret#caution"]

  - rule_id: PF-K8S-020
    domain: k8s
    title: "HPA target without resource requests"
    severity: high
    applies_to: {fact_kind: k8s.hpa}
    conditions:
      all:
        - {path: attrs.target_known, op: equals, value: true}
        - {path: attrs.target_has_requests, op: equals, value: false}
    message: "CPU-based autoscaling requires requests on the target workload"
    sources: ["k8s.io/docs/tasks/run-application/horizontal-pod-autoscale#algorithm-details"]

  - rule_id: PF-K8S-021
    domain: k8s
    title: "RBAC wildcard verbs or resources"
    severity: high
    applies_to: {fact_kind: k8s.rbac}
    conditions:
      any:
        - {path: attrs.wildcard_verbs, op: equals, value: true}
        - {path: attrs.wildcard_resources, op: equals, value: true}
    message: "wildcard grants are overbroad and hard to audit"
    sources: ["k8s.io/docs/reference/access-authn-authz/rbac#role-examples"]

  - rule_id: PF-K8S-022
    domain: k8s
    title: "Binding to cluster-admin"
    severity: critical
    applies_to: {fact_kind: k8s.rbac}
    conditions:
      all:
        - {path: attrs.binds_cluster_admin, op: equals, value: true}
    message: "cluster-admin grants unrestricted control of the cluster"
    sources: ["k8s.io/docs/reference/access-authn-authz/rbac#default-roles-and-role-bindings"]

  - rule_id: PF-K8S-023
    domain: k8s
    title: "Gateway listener without TLS"
    severity: medium
    applies_to: {fact_kind: k8s.gateway}
    conditions:
      all:
        - {path: attrs.has_plain_http_listener, op: equals, value: true}
    message: "plain HTTP/TCP listeners serve unencrypted traffic"
    sources: ["gateway-api.sigs.k8s.io/guides/tls/"]

  - rule_id: PF-K8S-024
    domain: k8s
    title: "Canary rollout without analysis"
    severity: medium
    applies_to: {fact_kind: k8s.workload}
    conditions:
      all:
        - {path: attrs.rollout.canary, op: equals, value: true}
        - {path: attrs.rollout.analysis_refs, op: empty}
    message: "canary steps without AnalysisTemplate rely on manual judgement"
    sources: ["argoproj.github.io/argo-rollouts/features/analysis/"]

  - rule_id: PF-K8S-025
    domain: k8s
    title: "Multi-replica workload without spread"
    severity: low
    applies_to: {fact_kind: k8s.workload}
    conditions:
      all:
        - {path: attrs.replicas, op: gte, value: 2}
        - {path: attrs.pod_spec.topology_spread, op: equals, value: false}
        - {path: attrs.pod_spec.has_pod_anti_affinity, op: equals, value: false}
    message: "replicas may colocate on one node/zone"
    sources: ["k8s.io/docs/concepts/scheduling-eviction/topology-spread-constraints/"]

  - rule_id: PF-K8S-026
    domain: k8s
    title: "PVC without explicit StorageClass"
    severity: low
    applies_to: {fact_kind: k8s.pvc}
    conditions:
      all:
        - {path: attrs.storage_class, op: empty}
    message: "implicit default class hides provisioning semantics"
    sources: ["k8s.io/docs/concepts/storage/persistent-volumes#class-1"]
