# Source registry — Platform Forge knowledge base.
# Every version-dependent claim must cite one of these entries (by `id`).
# Freshness status is computed by `platformforge/knowledge` (see KNOWLEDGE.md):
#   current | fresh | stale | deprecated | superseded | conflicted | unresolved
# `retrieved_at` is UTC date of last human/agent verification against the source.

schema: platformforge/source-registry/v1
sources:
  - id: cncf-maturity-model
    product: CNCF Platform Engineering Maturity Model
    source: https://tag-app-delivery.cncf.io/whitepapers/platform-eng-maturity-model/
    source_authority: official
    repo: https://github.com/cncf/tag-app-delivery/tree/main/platforms-maturity-model/v1
    version: "1.0"
    released: 2023-11-20
    retrieved_at: 2026-10-06
    scope: platform-maturity
    confidence: high
    notes: 5 aspects (investment, adoption, interfaces, operations, measurement) x
      4 levels (provisional, operational, scalable, optimizing). Platform Forge
      implements its own assessment inspired by this model, not a literal copy.

