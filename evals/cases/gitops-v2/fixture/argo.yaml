apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unscoped
  namespace: argocd
spec:
  source:
    repoURL: https://git.example.com/app.git
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: open
  namespace: argocd
spec:
  description: no restrictions
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: empty
  namespace: argocd
spec:
  generators: []
  template:
    spec: {}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: suspended
  namespace: flux-system
spec:
  suspend: true
  interval: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
