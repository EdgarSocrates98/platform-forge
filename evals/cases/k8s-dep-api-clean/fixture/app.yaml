apiVersion: apps/v1
kind: Deployment
metadata:
  name: modern-app
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels: {app: modern}
  template:
    metadata:
      labels: {app: modern}
    spec:
      containers:
        - name: app
          image: registry/app:2.0.0
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: modern-app
  namespace: prod
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: modern}
