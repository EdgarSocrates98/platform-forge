apiVersion: apps/v1
kind: Deployment
metadata:
  name: nopdb
  namespace: prod
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: app
          image: registry/app:1.0.0
          resources:
            requests: {cpu: 100m}
            limits: {cpu: 500m}
          securityContext:
            runAsNonRoot: true
          livenessProbe: {httpGet: {path: /h, port: 80}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orphan
  namespace: prod
spec:
  minReplicas: 2
  maxReplicas: 10
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ghost
  metrics:
    - type: Resource
      resource: {name: cpu}
