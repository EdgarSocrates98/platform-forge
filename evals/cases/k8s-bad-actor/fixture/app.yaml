apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad
  namespace: prod
spec:
  replicas: 2
  template:
    spec:
      hostNetwork: true
      automountServiceAccountToken: true
      containers:
        - name: app
          image: registry/app:1.0.0
          env:
            - name: DB_PASSWORD
              value: "supersecretvalue123"
          resources:
            requests: {cpu: 100m}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bad
  namespace: prod
spec:
  rules:
    - host: bad.example.com
---
apiVersion: v1
kind: Secret
metadata:
  name: creds
  namespace: prod
data:
  password: aHVudGVyMg==
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-bind
roleRef:
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: sa
    namespace: prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wild
rules:
  - verbs: ["*"]
    resources: ["*"]
    apiGroups: ["*"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
  namespace: prod
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: canary-noanalysis
  namespace: prod
spec:
  replicas: 3
  strategy:
    canary:
      steps:
        - setWeight: 50
  template:
    spec:
      containers:
        - name: app
          image: registry/app:1.0.0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: prod
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
